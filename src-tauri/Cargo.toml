[package]
name = "node-modules-cleaner"
version = "1.4.0"
description = "A cross-platform desktop app to scan and clean node_modules folders"
authors = ["Bartłomiej Zimny"]
license = "MIT"
repository = "https://github.com/jash90/node-modules-cleaner"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
# Free space per volume for the menu bar readout. Only the `disk` feature — the rest of
# sysinfo (processes, CPU, network) would be dead weight.
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

# Owner lookup when a delete fails, so "Permission denied" can be explained.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
