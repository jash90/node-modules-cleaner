name: Build

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_target: ''
          - platform: 'windows-latest'
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust_target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_target }}-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Ruby (macOS)
        if: runner.os == 'macOS'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Setup keychain and certificates (macOS)
        if: runner.os == 'macOS'
        working-directory: fastlane
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          bundle exec fastlane setup_ci_keychain
          bundle exec fastlane sync_certs

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'Node Modules Cleaner v__VERSION__'
          releaseBody: |
            ## Node Modules Cleaner

            Desktop application for reclaiming disk space from `node_modules` folders,
            merged Git worktrees, and shared developer caches.

            ### Finding and removing what is really there, with one Remove button
            - **Remove Selected** now also cleans the developer caches you tick, so the separate
              "Clean selected" button is gone. One confirmation lists every category with the total
              it frees, and a failure in one category no longer stops the others: the result says,
              per category, how many items were removed, how many failed and how much was freed
            - Every failure now names the path and the reason, and for files owned by another user
              the `sudo` command to run. Before, a failed delete only said "Check permissions"
            - A `node_modules` folder that something else already deleted counts as removed
              instead of failing, and removal only ever touches a real `node_modules` directory —
              never a symlink, and never another path
            - Projects inside `.worktrees/` and `.claude/worktrees/` checkouts are found, and a
              hidden folder picked for scanning is scanned. Build output that merely contains a
              folder named `node_modules` — Android `.cxx` mirrors, `.next`, bundled `.pnpm` and
              `.bun` copies, app bundles, and Claude Code's own install under `~/.claude` — is left
              out, so it is never offered for deletion
            - Merged worktrees are found in more cases: branches merged with GitHub's "Rebase and
              merge", squash merges that landed after the base branch moved on, and repositories
              whose main remote is not called `origin`. One broken branch reference no longer hides
              a whole repository, and a worktree that was only just created is not offered
            - Removing a stale worktree entry clears only that entry, not every other stale entry
              in the repository, and tool clones in hidden folders (`~/.oh-my-zsh`, `~/.nvm`,
              `~/.tmux/plugins`) are no longer fetched during a worktree scan
            - Scanning is faster: on a folder of about 150 projects the `node_modules` scan went
              from about 42 to 30 seconds and the worktree scan from about 36 to 25

            ### Worktree removal that survives a busy machine (1.6.0)
            - Removing worktrees no longer fails on ones something else already removed. A scan is
              a snapshot, and on a machine where agents and scripts clean up after every merge, a
              list can be hours out of date by the time you press Remove. Those worktrees used to
              fail with "No longer registered" and stay selected, so every later attempt failed on
              them again; they now count as removed and leave the list. A folder that still exists
              but is no longer a worktree is still refused and left alone
            - Worktrees with uncommitted changes can now be selected, and **Select all** takes
              everything except locked ones. The confirmation dialog names every worktree whose
              changes will be lost, and removes them only once you accept that
            - That consent is deliberately narrow: a worktree that was clean at scan time and has
              changes by the time you click is still refused, a worktree that gained a commit is
              always refused, and a lock is never overridden
            - The menu bar and the window now count the same thing. The window header shows how
              many worktrees are removable — the menu bar's number — next to the total, and the
              menu bar says "removable" rather than "ready to clean"
            - After every menu bar refresh the window compares its list with the menu bar's count
              for the same folder, and when they differ says the list may be out of date and offers
              a rescan. A **Rescan** button next to the scanned path skips the folder picker

            ### A background refresh that stops re-deriving what it already knows (1.5.0)
            - The menu bar count used to recompute everything from scratch every fifteen minutes.
              On a folder of 93 repositories with 44 linked worktrees that was 590 `git` processes
              and 12.5 seconds, every time, whether or not a commit had moved since the last run
            - Merge verdicts are now cached between refreshes and keyed on the commits they depend
              on — the worktree's HEAD and its base branch tips. Deciding a branch is *not* merged
              is the expensive half, around thirty processes, and those are exactly the branches
              that stay on disk for months, so the negative answers are cached too
            - Whether a worktree is dirty is deliberately never cached: files change without any
              ref moving, so that is still read fresh each refresh, for matched worktrees only
            - Base branches resolve in one `for-each-ref` instead of up to nine probes per
              repository, and a linked worktree is now recognised by reading its `.git` file
              rather than asking Git to resolve every discovered directory
            - Size and modification time come from one walk of a tree instead of two
            - Measured on the same folder: **590 `git` processes and 12.5s per refresh before,
              109 and about 5s after**, with byte-identical results
            - The refresh no longer writes anything. `git status` was rewriting `.git/index` in
              every repository it touched, and the squash probe built and destroyed a scratch
              directory around every single probe — verified as zero writes across 90 repositories
            - Git run for the menu bar is niced so it yields to whatever you are doing. macOS's
              background class was tried and rejected: it throttles disk I/O too, which turns a
              twelve-second refresh into a ten-minute one as soon as the work writes
            - Settings shows what the last few refreshes cost — duration, processes started, cache
              hits — since a job that runs unattended is otherwise invisible when it regresses
            - Fetching during a full scan is capped at eight repositories at a time instead of
              opening one connection per repository at once

            ### Menu bar mode (1.4.0)
            - Hide the Dock icon and run as a menu bar app (macOS); closing the window leaves the
              app in the menu bar rather than quitting it, and **Quit** in the tray menu ends it
            - Live readout of free disk space and worktrees ready to be removed, for a list of
              watched folders that now persists between runs — the app's first stored setting
            - Free space is reported for the volume each watched folder actually lives on, matched
              by longest mount point, so a folder on an external disk reports that disk
            - The worktree count comes from the same merge detection the window uses, minus the
              fetch and the size walk, so the background refresh never touches the network and
              never crawls `node_modules`. Refreshes every 15 minutes, on demand, and after a clean
            - Platform notes: the Dock toggle is macOS-only, tray text is unsupported on Windows
              and desktop-dependent on Linux (the menu carries the same information everywhere),
              and the Linux `.deb` now declares its `libayatana-appindicator3` runtime dependency

            ### Merged worktree detection, reworked (1.3.0)
            - Compare against every base branch a repository has — `origin/HEAD` plus
              `origin/main`, `origin/master`, `origin/development` and `origin/develop` —
              instead of `origin/HEAD` alone, which reported work merged into a second
              integration branch as still open
            - Detect squash merges, GitHub's default, which never make a branch an ancestor
              of its base. The probe writes into a scratch object directory and leaves the
              repository's object database untouched
            - Refresh remote-tracking refs before comparing, with no credential prompts and a
              hard timeout, so a branch merged an hour ago is not reported as open
            - Include worktrees with a detached HEAD; never offer one that holds a base branch
            - Report registrations whose directory is gone as stale and clear them with
              `git worktree prune`, instead of mislabelling them as having uncommitted changes
            - Tell untracked OS and watcher noise (`.DS_Store`, `.watchman-cookie-*`) apart
              from real changes: it is what makes Git refuse, so removal retries once with a
              single `-f` — never two, which is what bypassing a lock would need
            - Refuse a worktree that gained a commit after the scan, and say which of
              "already removed", "changed since scan", "no longer registered" and
              "no longer merged" actually happened
            - Collapse linked worktrees to one entry per real repository, so a directory of
              twenty worktrees is inspected once rather than twenty times

            ### Also in the app
            - Scan directories for `node_modules` folders and merged Git worktrees
            - Scan shared developer caches — npm, pnpm, bun, yarn, uv, Gradle, puppeteer, nvm
            - Detect pnpm stores abandoned when the tool moved its default location
            - Report what a delete actually frees, not the nominal folder size:
              allocated blocks rather than file lengths, hardlinked files counted once,
              and files still linked from outside the tree counted as zero
            - Delegate to a tool's own prune where one exists, so referenced entries survive
            - Empty unrotated logs in place, keeping the writing service's file handle valid
            - Batch delete with per-path failure reporting
            - Cross-platform support

            ### Downloads
            - **Windows**: `.msi` or `.exe` installer
            - **macOS**: `.dmg` (Intel & Apple Silicon)
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
